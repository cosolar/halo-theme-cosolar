apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: theme-cosolar-menuitem-x7r2k
spec:
  targetRef:
    group: ""
    kind: MenuItem
  formSchema:
    - $formkit: text
      name: icon
      label: 导航图标
      value: ""
      help: 图标名，根据主题"图标库"设置填写。Iconify 填 mdi:home（搜索 icon-sets.iconify.design），iconfont 填 icon-shouye。留空不显示图标
---
apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: theme-cosolar-post-r9k3m
spec:
  targetRef:
    group: content.halo.run
    kind: Post
  formSchema:
    - $formkit: text
      name: reading_url
      label: 自定义阅读地址
      value: ""
      help: 设置后，文章卡片的"阅读全文"链接将跳转到此地址（如外部博客、第三方平台），留空则使用默认文章链接
