<include src="layout.html">
  <template name="head">
    <title>知识库阅读</title>
    <!-- KaTeX 样式：渲染 cherry-markdown 已生成的公式 HTML（内置 .katex / .katex-display 排版与 KaTeX 字体） -->
    <link
      rel="stylesheet"
      th:href="@{/plugins/halo-plugin-minidocs/assets/static/katex/katex.min.css}"
    />
    <link rel="stylesheet" href="./css/doc.css" />
    <script type="module" src="./js/doc.ts"></script>
  </template>

  <div
    class="kb-app kb-page"
    th:classappend="${theme.config?.docs?.show_footer == false ? ' docs-hide-footer' : ''}"
    th:with="
      knowledgeBase = ${kbSlug != null ? minidocsFinder.getKnowledgeBase(kbSlug) : null},
      docTree = ${kbSlug != null ? minidocsFinder.getDocTree(kbSlug) : null},
      treeList = ${docTree != null ? docTree : null},
      docMode = ${knowledgeBase != null and knowledgeBase.spec != null and knowledgeBase.spec.docMode != null and !#strings.isEmpty(knowledgeBase.spec.docMode) ? knowledgeBase.spec.docMode : 'hierarchy'},
      defaultDocSlug = ${treeList != null and !treeList.isEmpty() ? treeList[0].slug : null},
      docSlug = ${docSlug != null ? docSlug : defaultDocSlug},
      docSlugParam = ${param.docSlug != null and !#strings.isEmpty(param.docSlug) ? param.docSlug : null},
      renderDoc = ${docMode != 'catalog' or docSlugParam != null},
      doc = ${docSlug != null ? minidocsFinder.getDocBySlug(docSlug) : null}
    "
    th:attr="data-doc-mode=${docMode}"
  >
    <!-- 顶部工具条：左侧知识库标识，右侧 点赞 / 访问量 / 返回 / 书签 / 分享 -->
    <div
      class="md-topbar"
      th:with="kbLogo=${knowledgeBase != null and knowledgeBase.spec != null and !#strings.isEmpty(knowledgeBase.spec.logo) ? knowledgeBase.spec.logo : null}"
    >
      <div class="nav-trails">
        <button
          class="nav-btn icon-only mobile-only md-toggle-drawer"
          type="button"
          id="md-toggle-sb"
          title="文档目录"
          aria-label="打开文档目录"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="md-kb-id">
          <span class="md-kb-logo">
            <img
              th:if="${kbLogo != null and !#strings.isEmpty(kbLogo)}"
              th:src="${kbLogo}"
              alt=""
            />
            <svg
              th:unless="${kbLogo != null and !#strings.isEmpty(kbLogo)}"
              viewBox="0 0 1024 1024"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M136.533333 170.666667a102.4 102.4 0 0 1 102.4-102.4h68.266667a238.7968 238.7968 0 0 1 204.8 115.780266A238.7968 238.7968 0 0 1 716.8 68.266667h68.266667a102.4 102.4 0 0 1 102.4 102.4v102.4a102.4 102.4 0 0 1 102.4 102.4v409.6a170.666667 170.666667 0 0 1-170.666667 170.666666H204.8a170.666667 170.666667 0 0 1-170.666667-170.666666V375.466667a102.4 102.4 0 0 1 102.4-102.4V170.666667z m0 170.666666a34.133333 34.133333 0 0 0-34.133333 34.133334v409.6a102.4 102.4 0 0 0 102.4 102.4h614.4a102.4 102.4 0 0 0 102.4-102.4V375.466667a34.133333 34.133333 0 0 0-34.133333-34.133334v409.6a102.4 102.4 0 0 0-102.4 102.4H238.933333a102.4 102.4 0 0 1-102.4-102.4V341.333333z m170.666667-204.8H238.933333a34.133333 34.133333 0 0 0-34.133333 34.133334v580.266666a34.133333 34.133333 0 0 0 34.133333 34.133334h238.933334V307.2a170.666667 170.666667 0 0 0-170.666667-170.666667z m477.866667 648.533334a34.133333 34.133333 0 0 0 34.133333-34.133334V170.666667a34.133333 34.133333 0 0 0-34.133333-34.133334h-68.266667a170.666667 170.666667 0 0 0-170.666667 170.666667v477.866667h238.933334z"
                fill="currentColor"
              ></path>
            </svg>
          </span>
          <div class="md-kb-name">
            <h2 th:text="${knowledgeBase != null ? knowledgeBase.spec.displayName : ''}"></h2>
          </div>
        </div>
      </div>
      <div class="nav-stats">
        <a class="nav-btn nav-btn--kb" th:href="@{/docs}" title="返回知识库列表">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>返回</span>
        </a>
        <button
          class="nav-btn icon-only nav-btn--bm"
          type="button"
          id="md-bookmark"
          title="加入浏览器书签"
          aria-label="加入浏览器书签"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path>
          </svg>
        </button>
        <button
          class="nav-btn icon-only nav-btn--sh"
          type="button"
          id="md-share"
          th:with="shareUrl=${knowledgeBase != null and knowledgeBase.spec != null and knowledgeBase.spec.shareEnabled == true and !#strings.isEmpty(knowledgeBase.spec.shareToken) ? '/docs/share/' + knowledgeBase.spec.shareToken : null}"
          th:attr="data-share-url=${shareUrl}"
          th:title="${shareUrl != null ? '打开分享页' : '复制链接'}"
          aria-label="分享"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
            <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line>
          </svg>
        </button>
        <button class="nav-btn nav-btn--like" id="md-like" type="button" title="点赞这个知识库">
          <svg
            class="heart"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
            ></path>
          </svg>
          <span class="nav-stat-num" id="md-like-count">0</span>
        </button>
        <span class="nav-stat nav-stat--view" title="访问量">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span class="nav-stat-num" id="md-view-count">0</span>
        </span>
        <button
          class="nav-btn icon-only mobile-only md-toggle-drawer"
          type="button"
          id="md-toggle-toc"
          title="文章大纲"
          aria-label="打开文章大纲"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3" y2="6"></line>
            <line x1="3" y1="12" x2="3" y2="12"></line>
            <line x1="3" y1="18" x2="3" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- 三栏阅读区 -->
    <div class="md-read" th:attr="data-kb-slug=${kbSlug}">
      <!-- 左侧：文档树 -->
      <aside class="md-sb" id="md-sb">
        <div class="md-sb-search">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.1" y2="16.1"></line>
          </svg>
          <input type="search" id="md-doc-search" placeholder="搜索文档..." aria-label="搜索文档" />
        </div>

        <div class="md-tree-wrap">
          <ul
            class="md-tree"
            th:with="isCatalog=${docMode == 'catalog'}"
            th:attr="data-doc-mode=${docMode}"
          >
            <th:block th:if="${treeList != null}" th:each="rootNode : ${treeList}">
              <th:block th:replace="~{:: treenode(node=${rootNode})}"></th:block>
            </th:block>
          </ul>
          <div
            class="md-empty md-tree-empty"
            th:if="${treeList == null or treeList.isEmpty()}"
            style="display: none"
          >
            暂无文档。
          </div>
        </div>
      </aside>

      <div class="resize-handle sb-resize" data-resize="sb"></div>

      <!-- 中间：正文 -->
      <main class="md-main" id="md-main">
        <div th:if="${doc != null}">
          <div
            class="md-content"
            id="md-prose"
            th:utext="${doc != null and renderDoc ? doc.spec.content : ''}"
          ></div>
          <!-- 目录模式：目录不是文档，右侧无内容可显示，等待 JS 打开其下第一个子文档 -->
          <div class="md-empty md-doc-loading" th:if="${!renderDoc}">
            <span class="md-loading-spin" aria-hidden="true"></span>
            <span>正在打开文档...</span>
          </div>
        </div>

        <div th:unless="${doc}" class="md-empty">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path
              d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"
            ></path>
          </svg>
          <span>该知识库暂无已发布文档</span>
          <p>去管理后台发布文档后，内容将在这里展示</p>
        </div>
      </main>

      <div class="resize-handle toc-resize" th:if="${doc}" data-resize="toc"></div>

      <!-- 右侧：文章大纲 -->
      <nav class="md-toc" id="md-toc" th:if="${doc}">
        <div class="md-toc-title">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3" y2="6"></line>
            <line x1="3" y1="12" x2="3" y2="12"></line>
            <line x1="3" y1="18" x2="3" y2="18"></line>
          </svg>
          <span>目录</span>
        </div>
        <ul class="md-toc-list" id="md-toc-list"></ul>
      </nav>
    </div>

    <!-- 底部：知识库统计 + 文章信息栏 -->
    <div class="md-bottom" th:if="${doc}">
      <div class="md-bottom-info">
        <span
          class="md-bottom-count"
          th:if="${knowledgeBase != null and knowledgeBase.status != null and knowledgeBase.status.docCount != null}"
        >
          共 <b th:text="${knowledgeBase.status.docCount}"></b> 篇
        </span>
        <span class="sep"></span>
        <span
          class="md-bottom-title"
          id="md-route"
          th:attr="data-root=${knowledgeBase != null ? knowledgeBase.spec.displayName : ''}"
          title="文档路由路径"
        >
          <span th:text="${knowledgeBase != null ? knowledgeBase.spec.displayName : ''}"></span>
          <span class="sep">/</span>
          <span th:text="${doc.spec.title}"></span>
        </span>
        <span class="sep"></span>
        <span><b id="md-words">0</b> 字</span>
        <span class="sep"></span>
        <span class="md-bottom-lines"><b id="md-lines">0</b> 行</span>
        <span class="md-mi" th:if="${doc.spec.author != null and !doc.spec.author.isEmpty()}">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="md-author-text" th:text="${doc.spec.author}"></span>
        </span>
      </div>

      <div class="md-bottom-meta">
        <span class="md-mi" th:if="${doc.metadata.creationTimestamp != null}">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="md-mi-label">创建</span>
          <span
            class="md-ts"
            id="md-created"
            th:attr="data-ts=${doc.metadata.creationTimestamp}"
            th:text="${doc.metadata.creationTimestamp}"
          ></span>
        </span>
        <span class="md-mi" th:if="${doc.spec.updateTime != null}">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="md-mi-label">更新</span>
          <span
            class="md-ts"
            id="md-updated"
            th:attr="data-ts=${doc.spec.updateTime}"
            th:text="${doc.spec.updateTime}"
          ></span>
        </span>
      </div>
      <button
        class="md-back-top"
        type="button"
        id="md-back-top"
        title="回到顶部"
        aria-label="回到顶部"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>

    <!-- 移动端抽屉遮罩 -->
    <div class="md-drawer-backdrop" id="md-drawer-backdrop"></div>

    <div class="md-toast" id="md-toast"></div>
  </div>

  <!-- 顶部未登录/登录由主题导航栏统一处理；此处仅补充文档树递归片段 -->
  <th:block th:fragment="treenode(node)" th:with="node=${node}">
    <th:block th:if="${node != null}">
      <li
        th:classappend="${node.children != null and !node.children.isEmpty()} ? 'md-has-child' : 'md-leaf'"
      >
        <a
          class="md-tree-link"
          th:href="@{'/docs/view/' + ${kbSlug} + '?docSlug=' + ${node.slug}}"
          th:attr="data-slug=${node.slug},
                    data-name=${node.name},
                    data-title=${node.title}"
          th:classappend="${(docSlug != null and docSlug == node.slug) ? ' active' : ''} + ${(isCatalog and node.children != null and !node.children.isEmpty()) ? ' md-catalog-link' : ''}"
        >
          <span
            class="md-tree-caret"
            th:if="${node.children != null and !node.children.isEmpty()}"
            title="展开 / 收起"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
          <!-- 目录模式：父文档仅作目录展示，用文件夹标识 -->
          <span
            class="md-folder"
            th:if="${isCatalog and node.children != null and !node.children.isEmpty()}"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
              ></path>
            </svg>
          </span>
          <!-- 目录模式：可阅读子文档用文档标识 -->
          <span
            class="md-doc-ico"
            th:if="${isCatalog and (node.children == null or node.children.isEmpty())}"
            aria-hidden="true"
          >
            <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M854.6 288.6L639.4 73.4c-6-6-14.1-9.4-22.6-9.4H192c-17.7 0-32 14.3-32 32v832c0 17.7 14.3 32 32 32h640c17.7 0 32-14.3 32-32V311.3c0-8.5-3.4-16.7-9.4-22.7zM790.2 326H602V137.8L790.2 326z m1.8 562H232V136h302v216c0 23.2 18.8 42 42 42h216v494z"
                fill="currentColor"
              ></path>
              <path
                d="M429 481.2c-1.9-4.4-6.2-7.2-11-7.2h-35c-6.6 0-12 5.4-12 12v272c0 6.6 5.4 12 12 12h27.1c6.6 0 12-5.4 12-12V582.1l66.8 150.2c1.9 4.3 6.2 7.1 11 7.1H524c4.7 0 9-2.8 11-7.1l66.8-150.6V758c0 6.6 5.4 12 12 12H641c6.6 0 12-5.4 12-12V486c0-6.6-5.4-12-12-12h-34.7c-4.8 0-9.1 2.8-11 7.2l-83.1 191-83.2-191z"
                fill="currentColor"
              ></path>
            </svg>
          </span>
          <!-- 父子文档模式：维持原有圆点标识 -->
          <span
            class="md-dot"
            th:if="${!isCatalog and (node.children == null or node.children.isEmpty())}"
          ></span>
          <span class="md-title-text" th:text="${node.title}"></span>
        </a>
        <ul th:if="${node.children != null and !node.children.isEmpty()}">
          <th:block th:each="child : ${node.children}">
            <th:block th:replace="~{:: treenode(node=${child})}"></th:block>
          </th:block>
        </ul>
      </li>
    </th:block>
  </th:block>
</include>
