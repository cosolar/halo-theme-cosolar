<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="header">
  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="header-inner container">
      <!-- Logo -->
      <a class="header-logo" th:href="@{/}">
        <img
          class="logo-image"
          th:if="${theme.config?.basic?.logo_image != null and !#strings.isEmpty(theme.config.basic.logo_image)}"
          th:src="${theme.config.basic.logo_image}"
          th:width="${theme.config?.basic?.logo_image_width ?: 36}"
          th:height="${theme.config?.basic?.logo_image_height ?: 36}"
          alt="Logo"
        />
        <span
          class="logo-icon"
          th:unless="${theme.config?.basic?.logo_image != null and !#strings.isEmpty(theme.config.basic.logo_image)}"
          >&lt;/&gt;</span
        >
        <span class="logo-text">
          <span class="logo-name" th:text="${theme.config?.basic?.logo_text ?: ''}">
            码迹志
          </span>
          <span class="logo-tagline" th:text="${theme.config?.basic?.tagline ?: site.subtitle}">
            记录技术成长，分享解决方案
          </span>
        </span>
      </a>

      <!-- Navigation -->
      <nav
        class="header-nav"
        id="headerNav"
        th:with="menu = ${menuFinder.getPrimary()}, iconProvider = ${theme.config?.style?.icon_provider ?: 'iconify'}"
      >
        <!-- 多级菜单递归片段（内联定义，随 layout 被 include 进各页面，支持任意层级） -->
        <th:block
          th:fragment="navItem"
          th:with="item=${item}, level=${level ?: 1}, iconProvider=${iconProvider ?: 'iconify'}"
        >
          <th:block th:if="${item != null}">
            <div
              class="nav-item"
              th:classappend="${item.children != null and not #lists.isEmpty(item.children)} ? ' has-children'"
            >
              <a
                th:href="@{${item.status.href}}"
                th:target="${item.spec.target?.value}"
                th:with="navIcon=${item != null ? #annotations.get(item, 'icon') : null}, isIconfont=${!#strings.isEmpty(navIcon) and #strings.startsWith(navIcon, 'iconfont')}"
              >
                <iconify-icon
                  th:if="${!#strings.isEmpty(navIcon) and !isIconfont}"
                  th:icon="${navIcon}"
                  inline
                ></iconify-icon>
                <i th:if="${!#strings.isEmpty(navIcon) and isIconfont}" th:class="${navIcon}"></i>
                <span th:text="${item.status.displayName}"></span>
                <svg
                  class="nav-caret"
                  th:if="${item.children != null and not #lists.isEmpty(item.children)}"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="9 6 15 12 9 18" />
                </svg>
              </a>
              <div
                class="nav-submenu"
                th:if="${item.children != null and not #lists.isEmpty(item.children)}"
                th:classappend="'nav-submenu-l' + ${level + 1}"
              >
                <th:block th:each="child : ${item.children}">
                  <th:block
                    th:replace="~{this :: navItem(item=${child}, level=${level + 1}, iconProvider=${iconProvider})}"
                  ></th:block>
                </th:block>
              </div>
            </div>
          </th:block>
        </th:block>

        <!-- 顶层菜单项 -->
        <th:block
          th:if="${menu != null and not #lists.isEmpty(menu.menuItems)}"
          th:each="item : ${menu.menuItems}"
        >
          <th:block
            th:replace="~{this :: navItem(item=${item}, level=1, iconProvider=${iconProvider})}"
          ></th:block>
        </th:block>
        <a th:unless="${menu != null and not #lists.isEmpty(menu.menuItems)}" th:href="@{/}"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-4M9 22V12h6v10" /></svg
          ><span>首页</span></a
        >
        <a
          th:unless="${menu != null and not #lists.isEmpty(menu.menuItems)}"
          th:href="@{${site.routes.categoriesUri}}"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
            /></svg
          ><span>分类</span></a
        >
        <a
          th:unless="${menu != null and not #lists.isEmpty(menu.menuItems)}"
          th:href="@{${site.routes.tagsUri}}"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
            />
            <line x1="7" y1="7" x2="7.01" y2="7" /></svg
          ><span>标签</span></a
        >
        <a
          th:unless="${menu != null and not #lists.isEmpty(menu.menuItems)}"
          th:href="@{${site.routes.archivesUri}}"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="21 8 21 21 3 21 3 8" />
            <rect x="1" y="3" width="22" height="5" />
            <line x1="10" y1="12" x2="14" y2="12" /></svg
          ><span>归档</span></a
        >
      </nav>

      <!-- Actions -->
      <div class="header-actions">
        <!-- Search -->
        <div
          class="search-box"
          th:if="${pluginFinder.available('PluginSearchWidget')}"
          onclick="javascript: SearchWidget.open();"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <span class="search-placeholder">搜索文章</span>
          <span class="search-kbd">Ctrl K</span>
        </div>
        <a
          class="search-box"
          th:unless="${pluginFinder.available('PluginSearchWidget')}"
          th:href="@{${site.routes.archivesUri}}"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <span class="search-placeholder">搜索文章</span>
        </a>

        <!-- Theme Toggle -->
        <button class="icon-btn" id="themeToggle" aria-label="切换主题">
          <svg
            class="moon-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg
            class="sun-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>

        <!-- Login / User Menu -->
        <th:block
          th:with="currentUser = ${contributorFinder.getContributor(#authentication.name)}"
        >
          <!-- 已登录 -->
          <div th:if="${!#strings.equals(currentUser.name, 'anonymousUser')}" class="user-menu">
            <button
              class="action-login is-logged-in"
              type="button"
              aria-label="用户菜单"
              aria-haspopup="true"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                <g
                  fill="currentColor"
                  fill-opacity="0"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                >
                  <path
                    stroke-dasharray="22"
                    d="M12 5c1.66 0 3 1.34 3 3c0 1.66 -1.34 3 -3 3c-1.66 0 -3 -1.34 -3 -3c0 -1.66 1.34 -3 3 -3Z"
                  >
                    <animate
                      fill="freeze"
                      attributeName="stroke-dashoffset"
                      dur="0.5s"
                      values="22;0"
                    ></animate>
                    <animate
                      fill="freeze"
                      attributeName="fill-opacity"
                      begin="1.1s"
                      dur="0.15s"
                      to=".3"
                    ></animate>
                  </path>
                  <path
                    stroke-dasharray="38"
                    stroke-dashoffset="38"
                    d="M12 14c4 0 7 2 7 3v2h-14v-2c0 -1 3 -3 7 -3Z"
                  >
                    <animate
                      fill="freeze"
                      attributeName="stroke-dashoffset"
                      begin="0.5s"
                      dur="0.5s"
                      to="0"
                    ></animate>
                    <animate
                      fill="freeze"
                      attributeName="fill-opacity"
                      begin="1.1s"
                      dur="0.15s"
                      to=".3"
                    ></animate>
                  </path>
                </g>
              </svg>
            </button>
            <div class="user-dropdown" role="menu">
              <div class="user-dropdown-info">
                <span class="user-avatar">
                  <img
                    th:if="${currentUser.avatar != null and !#strings.isEmpty(currentUser.avatar)}"
                    th:src="${currentUser.avatar}"
                    th:alt="${currentUser.displayName}"
                  />
                  <span
                    th:unless="${currentUser.avatar != null and !#strings.isEmpty(currentUser.avatar)}"
                    th:text="${#strings.substring(currentUser.displayName, 0, 1)}"
                    >U</span
                  >
                </span>
                <div class="user-info-text">
                  <span class="user-name" th:text="${currentUser.displayName}">用户名</span>
                  <span
                    class="user-bio"
                    th:text="${theme.config?.social?.author_bio ?: '专注技术，乐于分享'}"
                    >专注技术，乐于分享</span
                  >
                </div>
              </div>
              <a
                class="user-dropdown-item"
                th:href="@{/console/posts/editor}"
                role="menuitem"
                target="_blank"
              >
                <div class="item-icon">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                    <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                  </svg>
                </div>
                <div class="item-content">
                  <span class="item-title">发布文章</span>
                  <span class="item-desc">分享你的知识与见解</span>
                </div>
                <svg
                  class="item-arrow"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="9 18 15 12 9 6" />
                </svg>
              </a>
              <a class="user-dropdown-item" th:href="@{/uc}" role="menuitem">
                <div class="item-icon">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                </div>
                <div class="item-content">
                  <span class="item-title">个人中心</span>
                  <span class="item-desc">管理你的账号和资料</span>
                </div>
                <svg
                  class="item-arrow"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="9 18 15 12 9 6" />
                </svg>
              </a>
              <a class="user-dropdown-item" th:href="@{/console}" role="menuitem">
                <div class="item-icon">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="3" />
                    <path
                      d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                    />
                  </svg>
                </div>
                <div class="item-content">
                  <span class="item-title">控制台</span>
                  <span class="item-desc">站点设置与数据管理</span>
                </div>
                <svg
                  class="item-arrow"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="9 18 15 12 9 6" />
                </svg>
              </a>
              <div class="user-dropdown-divider"></div>
              <a
                class="user-dropdown-item user-dropdown-item-danger"
                th:href="@{/logout}"
                role="menuitem"
              >
                <div class="item-icon item-icon-danger">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="21" x2="9" y2="12" />
                  </svg>
                </div>
                <div class="item-content">
                  <span class="item-title">退出登录</span>
                  <span class="item-desc">安全退出当前账号</span>
                </div>
                <svg
                  class="item-arrow"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="9 18 15 12 9 6" />
                </svg>
              </a>
            </div>
          </div>
          <!-- 未登录 -->
          <a
            class="action-login"
            th:unless="${!#strings.equals(currentUser.name, 'anonymousUser')}"
            th:href="@{/login}"
            aria-label="登录"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
              <g
                fill="currentColor"
                fill-opacity="0"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
              >
                <path
                  stroke-dasharray="22"
                  d="M12 5c1.66 0 3 1.34 3 3c0 1.66 -1.34 3 -3 3c-1.66 0 -3 -1.34 -3 -3c0 -1.66 1.34 -3 3 -3Z"
                >
                  <animate
                    fill="freeze"
                    attributeName="stroke-dashoffset"
                    dur="0.5s"
                    values="22;0"
                  ></animate>
                  <animate
                    fill="freeze"
                    attributeName="fill-opacity"
                    begin="1.1s"
                    dur="0.15s"
                    to=".3"
                  ></animate>
                </path>
                <path
                  stroke-dasharray="38"
                  stroke-dashoffset="38"
                  d="M12 14c4 0 7 2 7 3v2h-14v-2c0 -1 3 -3 7 -3Z"
                >
                  <animate
                    fill="freeze"
                    attributeName="stroke-dashoffset"
                    begin="0.5s"
                    dur="0.5s"
                    to="0"
                  ></animate>
                  <animate
                    fill="freeze"
                    attributeName="fill-opacity"
                    begin="1.1s"
                    dur="0.15s"
                    to=".3"
                  ></animate>
                </path>
              </g>
            </svg>
          </a>
        </th:block>

        <!-- Mobile Menu Toggle -->
        <button class="menu-toggle" id="menuToggle" aria-label="菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Nav Backdrop -->
  <div class="nav-backdrop" id="navBackdrop"></div>
</th:block>
