<aside
  class="sidebar"
  th:fragment="sidebar"
  th:with="
    iconProvider=${theme.config?.style?.icon_provider ?: 'iconify'}
  "
>
  <th:block th:each="m : ${theme.config?.sidebar?.general?.sidebar_modules}">
    <th:block th:switch="${m.module}">
      <!-- Author Profile -->
      <th:block th:case="'author'">
        <div
          class="widget widget-author"
          th:if="${theme.config?.sidebar?.author?.show_author != false}"
          th:with="
               authorName=${theme.config?.social?.author_name ?: site.title},
               authorAvatar=${theme.config?.social?.author_avatar},
               authorBio=${theme.config?.social?.author_bio},
               authorBg=${theme.config?.sidebar?.author?.author_bg_image},
               authorBgCol=${theme.config?.sidebar?.author?.author_bg_color},
               hasBg=${authorBg != null and !#strings.isEmpty(authorBg)},
               hasBgCol=${authorBgCol != null and !#strings.isEmpty(authorBgCol)},
               postStats=${postFinder.list({page: 1, size: 1})},
               catStats=${categoryFinder.list(1, 1)},
               tagStats=${tagFinder.list(1, 1)}"
          th:classappend="${hasBg or hasBgCol} ? 'has-bg' : ''"
          th:style="${hasBg ? 'background:url(' + authorBg + ') center/cover no-repeat;' : (hasBgCol ? 'background:' + authorBgCol + ';' : '')}"
        >
          <div class="author-profile">
            <div class="author-avatar">
              <img
                th:if="${authorAvatar != null and !#strings.isEmpty(authorAvatar)}"
                th:src="${authorAvatar}"
                th:alt="${authorName}"
              />
              <span
                th:unless="${authorAvatar != null and !#strings.isEmpty(authorAvatar)}"
                class="author-avatar-fallback"
                th:text="${#strings.length(authorName) > 0 ? authorName.substring(0,1) : 'B'}"
              ></span>
            </div>
            <h3 class="author-name" th:text="${authorName}"></h3>
            <p
              class="author-bio"
              th:if="${authorBio != null and !#strings.isEmpty(authorBio)}"
              th:text="${authorBio}"
            ></p>
            <div class="author-divider"></div>
            <div class="author-stats">
              <a class="author-stat" th:href="@{${site.routes.archivesUri}}">
                <span class="author-stat-num" th:text="${postStats.total}">0</span>
                <span class="author-stat-label">文章</span>
              </a>
              <a class="author-stat" th:href="@{${site.routes.categoriesUri}}">
                <span class="author-stat-num" th:text="${catStats.total}">0</span>
                <span class="author-stat-label">分类</span>
              </a>
              <a class="author-stat" th:href="@{${site.routes.tagsUri}}">
                <span class="author-stat-num" th:text="${tagStats.total}">0</span>
                <span class="author-stat-label">标签</span>
              </a>
            </div>
            <div class="author-meta">
              <!-- 动态社交图标：配置后显示，通过图标库名称渲染 -->
              <th:block
                th:if="${theme.config?.social?.author_social_links != null and #lists.size(theme.config?.social?.author_social_links) > 0}"
              >
                <a
                  th:each="link : ${theme.config?.social?.author_social_links}"
                  th:if="${link.enabled != false and ((link.icon_name != null and !#strings.isEmpty(link.icon_name)) or (link.url != null and !#strings.isEmpty(link.url)))}"
                  th:href="${(link.url != null and !#strings.isEmpty(link.url)) ? link.url : '#'}"
                  th:aria-label="${(link.name != null and !#strings.isEmpty(link.name)) ? link.name : '社交链接'}"
                  class="author-link"
                  target="_blank"
                  rel="noopener"
                  th:classappend="${link.url == null or #strings.isEmpty(link.url)} ? 'is-disabled' : ''"
                  th:with="iconIsIconfont=${link.icon_name != null and !#strings.isEmpty(link.icon_name) and #strings.startsWith(link.icon_name, 'iconfont')}"
                >
                  <!-- ① Iconify 图标：图标名不以 iconfont 开头 -->
                  <iconify-icon
                    th:if="${link.icon_name != null and !#strings.isEmpty(link.icon_name) and !iconIsIconfont}"
                    th:icon="${link.icon_name}"
                    inline
                  ></iconify-icon>
                  <!-- ② iconfont 字体图标：图标名以 iconfont 开头（如 "iconfont icon-xxx"） -->
                  <i
                    th:if="${link.icon_name != null and !#strings.isEmpty(link.icon_name) and iconIsIconfont}"
                    th:class="${link.icon_name}"
                  ></i>
                </a>
              </th:block>
            </div>
          </div>
        </div>
      </th:block>

      <!-- Announcement -->
      <th:block th:case="'announcement'">
        <div
          class="widget widget-announcement"
          th:if="${theme.config?.sidebar?.announcement?.show_announcement != false and theme.config?.sidebar?.announcement?.announcement_content != null and !#strings.isEmpty(theme.config.sidebar.announcement?.announcement_content)}"
        >
          <div class="widget-title">
            <span class="title-text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              公告
            </span>
          </div>
          <div
            class="announcement-content"
            th:utext="${theme.config?.sidebar?.announcement?.announcement_content}"
          ></div>
        </div>
      </th:block>

      <!-- Tag Cloud -->
      <th:block th:case="'tag_cloud'">
        <div
          class="widget widget-tag-cloud"
          th:if="${theme.config?.sidebar?.tag_cloud?.show_tag_cloud == true}"
          th:with="tagCloud = ${tagFinder.list(1, theme.config?.sidebar?.tag_cloud?.tag_cloud_count ?: 20)}"
        >
          <div class="widget-title">
            <span class="title-text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
                />
                <line x1="7" y1="7" x2="7.01" y2="7" />
              </svg>
              热门标签
            </span>
            <a class="widget-link" th:href="@{${site.routes.tagsUri}}">全部标签 →</a>
          </div>
          <div class="tag-cloud-body">
            <a
              th:each="tag, iter : ${tagCloud.items}"
              th:href="@{${tag.status.permalink}}"
              th:text="${tag.spec.displayName}"
              th:with="weight = ${tag.postCount != null ? tag.postCount : 1}, size = ${weight >= 30 ? 16 : 11 + weight * 0.16}"
              th:style="'font-size: ' + ${size} + 'px; animation-delay: ' + (${iter.index} * 0.12) + 's;'"
              class="tag-cloud-item"
            ></a>
          </div>
        </div>
      </th:block>

      <!-- WeChat QR -->
      <th:block th:case="'wechat'">
        <div
          class="widget widget-wechat"
          th:if="${theme.config?.sidebar?.wechat?.show_wechat_qr == true and theme.config?.sidebar?.wechat?.wechat_qr_image != null and !#strings.isEmpty(theme.config.sidebar.wechat?.wechat_qr_image)}"
          th:with="qrTitle = ${theme.config?.sidebar?.wechat?.wechat_qr_title}"
        >
          <div class="widget-title">
            <span class="title-text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
              </svg>
              公众号
            </span>
          </div>
          <div class="wechat-qr-body">
            <img
              class="wechat-qr-img"
              th:src="${theme.config?.sidebar?.wechat?.wechat_qr_image}"
              alt="公众号二维码"
            />
            <p
              class="wechat-qr-text"
              th:text="${qrTitle != null and !#strings.isEmpty(qrTitle) ? qrTitle : '扫码关注'}"
            ></p>
          </div>
        </div>
      </th:block>

      <!-- Categories -->
      <th:block th:case="'categories'">
        <div
          class="widget"
          th:if="${theme.config?.sidebar?.categories?.show_categories != false}"
          th:with="catResult = ${categoryFinder.list(1, theme.config?.sidebar?.categories?.categories_count ?: 6)}"
        >
          <div class="widget-title">
            <span class="title-text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
                />
              </svg>
              专题类别
            </span>
            <a class="widget-link" th:href="@{${site.routes.categoriesUri}}">全部类别 →</a>
          </div>
          <div class="category-grid" th:if="${not #lists.isEmpty(catResult.items)}">
            <a
              th:each="cat, iter : ${catResult.items}"
              th:href="@{${cat.status.permalink}}"
              class="category-item"
            >
              <span class="category-icon">
                <svg viewBox="0 0 48 48" fill="none">
                  <path
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="4"
                    d="M5 6h34s4 2 4 7s-4 7-4 7H5s4-2 4-7s-4-7-4-7m38 22H9s-4 2-4 7s4 7 4 7h34s-4-2-4-7s4-7 4-7"
                  />
                </svg>
              </span>
              <span class="category-info">
                <span class="category-name" th:text="${cat.spec.displayName}"></span>
                <span class="category-count" th:text="${cat.postCount + ' 篇'}"></span>
              </span>
            </a>
          </div>
        </div>
      </th:block>

      <!-- Recent Updates -->
      <th:block th:case="'recent'">
        <div
          class="widget"
          th:if="${theme.config?.sidebar?.recent?.show_recent != false}"
          th:with="recentPosts = ${postFinder.list({page: 1, size: theme.config?.sidebar?.recent?.recent_count ?: 4, sort: {'spec.publishTime,desc'}})}"
        >
          <div class="widget-title">
            <span class="title-text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              </svg>
              近期更新
            </span>
            <a class="widget-link" th:href="@{${site.routes.archivesUri}}">查看全部 →</a>
          </div>
          <div class="recent-list">
            <div class="recent-item" th:each="post : ${recentPosts.items}">
              <span class="recent-badge">NEW</span>
              <div class="recent-info">
                <div class="recent-title">
                  <a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}"></a>
                </div>
                <div
                  class="recent-date"
                  th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </th:block>

      <!-- 友情链接 -->
      <th:block th:case="'links'">
        <div
          class="widget widget-sidebar-links"
          th:if="${theme.config?.sidebar?.links?.show_sidebar_links != false and linkFinder != null}"
          th:with="randomLinks = ${linkFinder?.random(theme.config?.sidebar?.links?.sidebar_links_count ?: 10) ?: {}}"
        >
          <div class="widget-title">
            <span class="title-text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </svg>
              友情链接
            </span>
            <a class="widget-link" th:href="@{/links}">全部友链 →</a>
          </div>
          <div class="sidebar-links-list" th:if="${not #lists.isEmpty(randomLinks)}">
            <a
              th:each="link : ${randomLinks}"
              th:href="${link.spec.url}"
              class="sidebar-link-item"
              target="_blank"
              rel="noopener"
            >
              <span class="sidebar-link-logo">
                <img
                  th:if="${!#strings.isEmpty(link.spec.logo)}"
                  th:src="${link.spec.logo}"
                  th:alt="${link.spec.displayName}"
                  loading="lazy"
                  onerror="
                    this.style.display = 'none';
                    this.parentElement.classList.add('is-fallback');
                  "
                />
                <span
                  class="sidebar-link-logo-fallback"
                  th:unless="${!#strings.isEmpty(link.spec.logo)}"
                  th:text="${#strings.substring(link.spec.displayName, 0, 1)}"
                ></span>
              </span>
              <span class="sidebar-link-info">
                <span class="sidebar-link-name" th:text="${link.spec.displayName}"></span>
                <span
                  class="sidebar-link-desc"
                  th:if="${!#strings.isEmpty(link.spec.description)}"
                  th:text="${link.spec.description}"
                ></span>
              </span>
            </a>
          </div>
        </div>
      </th:block>

      <!-- 订阅资讯 -->
      <th:block th:case="'feeds'">
        <div
          class="widget widget-sidebar-feeds"
          th:if="${linkFeedFinder != null and theme.config?.sidebar?.feeds?.show_sidebar_feeds != false}"
          th:with="recentFeeds = ${linkFeedFinder.list({limit: theme.config?.sidebar?.feeds?.sidebar_feeds_count ?: 10})}"
        >
          <div class="widget-title">
            <span class="title-text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 11a9 9 0 0 1 9 9" />
                <path d="M4 4a16 16 0 0 1 16 16" />
                <circle cx="5" cy="19" r="1" />
              </svg>
              订阅资讯
            </span>
            <a class="widget-link" th:href="@{/feeds}">全部资讯 →</a>
          </div>
          <div
            class="sidebar-feeds-list"
            th:if="${recentFeeds != null and !#lists.isEmpty(recentFeeds.items)}"
          >
            <a
              th:each="feed : ${recentFeeds.items}"
              th:href="${feed.url}"
              class="sidebar-feed-item"
              target="_blank"
              rel="noopener"
            >
              <span class="sidebar-feed-title" th:text="${feed.title}"></span>
              <span class="sidebar-feed-meta">
                <span
                  class="sidebar-feed-source"
                  th:text="${feed.author != null and !#strings.isEmpty(feed.author) ? feed.author : feed.authorUrl}"
                ></span>
                <span
                  class="sidebar-feed-date"
                  th:if="${feed.publishedAt != null}"
                  th:text="${#temporals.format(feed.publishedAt, 'yyyy-MM-dd')}"
                ></span>
              </span>
            </a>
          </div>
          <div
            class="empty-state"
            th:if="${recentFeeds == null or #lists.isEmpty(recentFeeds.items)}"
            style="padding: 16px 0"
          >
            <p
              style="font-size: 13px; color: var(--color-text-muted); text-align: center; margin: 0"
            >
              暂无订阅资讯
            </p>
          </div>
        </div>
      </th:block>

      <!-- 广告位：用户可自定义 HTML 内容 -->
      <th:block th:case="'ad'">
        <div
          class="widget widget-sidebar-ad"
          th:if="${theme.config?.sidebar?.ad?.show_sidebar_ad == true and theme.config?.sidebar?.ad?.sidebar_ad_content != null and !#strings.isEmpty(theme.config.sidebar.ad?.sidebar_ad_content)}"
        >
          <div
            class="widget-title"
            th:if="${theme.config?.sidebar?.ad?.sidebar_ad_title != null and !#strings.isEmpty(theme.config.sidebar.ad?.sidebar_ad_title)}"
          >
            <span class="title-text">
              <svg viewBox="0 0 1024 1024" fill="currentColor" width="16" height="16">
                <path
                  d="M843.2 134.4H198.4c-35.2 0-64 28.8-64 64V768c0 35.2 28.8 64 64 64h644.8c35.2 0 64-28.8 64-64V198.4c0-35.2-28.8-64-64-64z m0 601.6c0 17.6-14.4 32-32 32H230.4c-17.6 0-32-14.4-32-32V230.4c0-17.6 14.4-32 32-32h580.8c17.6 0 32 14.4 32 32V736zM721.6 856H320c-17.6 0-32 14.4-32 32s14.4 32 32 32h401.6c17.6 0 32-14.4 32-32s-14.4-32-32-32z"
                  p-id="9399"
                ></path>
                <path
                  d="M435.2 361.6c-1.6-4.8-6.4-8-11.2-8h-35.2c-4.8 0-9.6 3.2-11.2 8l-92.8 243.2c-1.6 3.2-1.6 8 1.6 11.2 1.6 3.2 6.4 4.8 9.6 4.8h33.6c4.8 0 9.6-3.2 11.2-8l24-65.6h84.8l25.6 65.6c1.6 4.8 6.4 8 11.2 8h36.8c4.8 0 8-1.6 9.6-4.8 1.6-3.2 3.2-8 1.6-11.2l-99.2-243.2z m-52.8 136l20.8-56c1.6-3.2 1.6-6.4 3.2-9.6 1.6 4.8 3.2 8 4.8 12.8l19.2 51.2h-48z m337.6-120c-11.2-9.6-25.6-16-40-20.8-11.2-3.2-25.6-3.2-46.4-3.2h-83.2c-6.4 0-12.8 4.8-12.8 12.8v243.2c0 6.4 4.8 12.8 12.8 12.8h88c16 0 30.4-1.6 41.6-4.8 12.8-3.2 24-8 33.6-14.4 9.6-6.4 17.6-14.4 25.6-25.6 8-11.2 14.4-24 17.6-38.4 4.8-16 6.4-33.6 6.4-52.8 0-22.4-3.2-43.2-9.6-62.4-8-19.2-19.2-33.6-33.6-46.4z m-20.8 152c-3.2 11.2-8 19.2-14.4 25.6-4.8 4.8-9.6 8-17.6 9.6-8 3.2-19.2 3.2-33.6 3.2h-40V406.4H632c22.4 0 32 1.6 36.8 4.8 9.6 3.2 17.6 11.2 24 22.4 6.4 11.2 11.2 28.8 11.2 52.8 1.6 16 0 30.4-4.8 43.2z"
                  p-id="9400"
                ></path>
              </svg>
              <span th:text="${theme.config?.sidebar?.ad?.sidebar_ad_title}">广告</span>
            </span>
          </div>
          <div
            class="sidebar-ad-content"
            th:utext="${theme.config?.sidebar?.ad?.sidebar_ad_content}"
          ></div>
        </div>
      </th:block>
    </th:block>
  </th:block>
</aside>
