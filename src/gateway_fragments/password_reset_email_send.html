<th:block th:fragment="form">
  <form th:if="${sent}" method="get" action="/login" class="halo-form">
    <div class="form-item">
      <div class="alert">重置邮件已发送，请前往您的邮箱查收。</div>
    </div>
    <div class="form-item">
      <button type="submit">前往登录</button>
    </div>
  </form>
  <form
    th:unless="${sent}"
    class="halo-form"
    th:action="@{/password-reset/email}"
    method="post"
    th:object="${form}"
  >
    <div class="alert alert-error" th:if="${param.error.size() > 0}">
      <strong th:if="${param.error[0] == 'invalid_reset_token'}"
        >重置链接无效或已过期，请重新获取。</strong
      >
    </div>
    <div class="alert alert-error" th:if="${error}">
      <strong th:if="${error == 'rate_limit_exceeded'}">发送频率受限，请稍后再试。</strong>
    </div>
    <div class="form-item">
      <label for="email">邮箱</label>
      <div class="form-input">
        <input
          type="email"
          id="email"
          name="email"
          autofocus
          required
          th:field="*{email}"
          placeholder="请输入您的账号邮箱"
        />
      </div>
      <p
        class="alert alert-error"
        role="alert"
        th:if="${#fields.hasErrors('email')}"
        th:errors="*{email}"
      ></p>
    </div>
    <div class="form-item">
      <button type="submit">发送重置链接</button>
    </div>
  </form>
</th:block>
